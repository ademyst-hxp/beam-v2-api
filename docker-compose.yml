services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: beam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: hxp-api
    container_name: HexapiumAPI
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 5000:5000

  cron:
    build: .
    command: npm run cron

volumes:
  pgdata: